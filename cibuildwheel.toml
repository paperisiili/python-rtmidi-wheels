# Build settings for the python-rtmidi wheels this repository publishes.
#
# Passed to cibuildwheel with --config-file, which replaces the [tool.cibuildwheel] block inside
# the sdist rather than merging with it, so upstream's choice of Python versions does not carry
# over. The replacement is wholesale, which also means upstream's own test hook would be silently
# lost; it is restated in the test-command lists below.
#
# On Linux and macOS archs is left at its default of "auto": each job builds only what its own
# runner is, and the workflow's matrix supplies one runner per architecture. Setting archs for
# those here instead would make every runner try to build every architecture. Windows is the
# exception and is pinned below, because "auto" there covers 32-bit as well as 64-bit.

[tool.cibuildwheel]
# cp314t is the free-threaded interpreter, which upstream has no wheels for either. 3.13's
# free-threading was experimental and cibuildwheel 4.x refuses cp313t outright, so 3.13t still
# falls back to the sdist. python-rtmidi's extension predates free-threading, so importing it
# turns the GIL back on for that process (CPython says so on import); the wheel still spares the
# interpreter the compiler-and-headers requirement, which is this repository's whole point.
build = "cp313-* cp314-* cp314t-*"
# musllinux (Alpine and other musl systems) is not built, matching upstream: the JACK build in
# before-all is dnf- and glibc-specific, and no one has asked. Musl systems fall back to
# compiling the sdist. The README says so too.
skip = "*-musllinux_*"
build-frontend = "build"

# Declarative rather than load-bearing: jack already defaults to true in upstream's
# meson_options.txt, and meson looks JACK up with required: false, so this setting cannot fail a
# build whose JACK install broke. The test-command assertions below are the actual guarantee.
config-settings = { setup-args = "-Djack=true" }

# Upstream's CI-marked test suite, restated because --config-file replaces the block that
# carried it. Each platform's test-command runs it before its own backend assertions.
test-requires = ["pytest"]

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

# ALSA headers, then JACK built from source, since the manylinux images package neither JACK nor
# a JACK development package. JACK is fetched as a git clone pinned to the commit that v1.9.22
# points at today: a tag can be repointed, a commit cannot, so a moved tag fails the equality
# check instead of silently changing what gets bundled. The same version and commit are recorded
# in .github/workflows/build-wheels.yml (JACK2_VERSION / JACK2_COMMIT), where the identical
# source tree is archived for publication beside the wheels — keep the two files in step.
before-all = [
    "dnf -y install alsa-lib-devel",
    "git clone --depth 1 --branch v1.9.22 https://github.com/jackaudio/jack2",
    "cd jack2",
    "test \"$(git rev-parse HEAD)\" = 4f58969432339a250ce87fe855fb962c67d00ddb",
    "python3 waf configure --prefix=/usr --autostart=none --classic --pkgconfigdir=/usr/lib64/pkgconfig",
    "python3 waf build",
    "python3 waf install",
]

# libasound is left as a system library, which is what upstream does and what every machine with
# ALSA already satisfies. libjack is copied in instead, so that a wheel built against JACK still
# imports on a machine that has never installed it; it lands in auditwheel's default
# python_rtmidi.libs directory. After the build, the workflow runs add_notices.py so the
# bundled library's LGPL text and provenance notice travel inside each Linux wheel.
repair-wheel-command = "auditwheel repair --exclude libasound.so.2 -w {dest_dir} {wheel}"

# Both backends are asserted because with JACK present the build marks ALSA as optional: a failed
# or forgotten alsa-lib-devel would otherwise yield a JACK-only wheel, quietly and with nothing
# in the build failing. get_compiled_api() reports what was linked without opening a device, so
# this passes inside a container with no /dev/snd/seq. Every quote inside is single, so the
# assertion line runs under both sh and cmd.
test-command = [
    "pytest -v -m ci {package}/tests",
    '''python -c "import rtmidi; api = rtmidi.get_compiled_api(); assert rtmidi.API_LINUX_ALSA in api, 'ALSA was not compiled in'; assert rtmidi.API_UNIX_JACK in api, 'JACK was not compiled in'; print('compiled APIs:', [rtmidi.get_api_display_name(a) for a in api])"''',
]

[tool.cibuildwheel.macos]
# CoreMIDI comes from the SDK, so there is nothing to install. JACK is available for macOS but is
# not installed here, matching upstream, so these are CoreMIDI-only.
test-command = [
    "pytest -v -m ci {package}/tests",
    '''python -c "import rtmidi; api = rtmidi.get_compiled_api(); assert rtmidi.API_MACOSX_CORE in api, 'CoreMIDI was not compiled in'; print('compiled APIs:', [rtmidi.get_api_display_name(a) for a in api])"''',
]

[tool.cibuildwheel.windows]
# The multimedia API comes from the platform SDK, so there is nothing to install. JACK exists for
# Windows but is not installed here, matching upstream. Pinned to 64-bit, which the default would
# otherwise widen to include 32-bit.
archs = ["AMD64"]

# --vsenv activates the Visual Studio environment. Without it the build picks up whichever GCC is
# on the runner's PATH and produces a MinGW extension instead: several times the size, statically
# linked against GCC's runtime, and dragging a copy of the system C runtime into the wheel behind
# it. CPython on Windows is an MSVC build, so its extensions should be too.
#
# The jack setting is repeated rather than added to, because a platform table replaces the
# top-level config-settings rather than merging with it.
config-settings = { setup-args = ["-Djack=true", "--vsenv"] }

# Stated explicitly even though it matches cibuildwheel's default, because the README's claim
# that the Windows wheels carry msvcp140.dll rests on it: delvewheel bundles the MSVC runtime so
# the wheels import on machines without the Visual C++ redistributable installed.
repair-wheel-command = "delvewheel repair -w {dest_dir} -v {wheel}"

test-command = [
    "pytest -v -m ci {package}/tests",
    '''python -c "import rtmidi; api = rtmidi.get_compiled_api(); assert rtmidi.API_WINDOWS_MM in api, 'Windows MultiMedia was not compiled in'; print('compiled APIs:', [rtmidi.get_api_display_name(a) for a in api])"''',
]

# macOS deployment targets pinned to what cibuildwheel 4.2.0 defaults to today, so a future
# cibuildwheel bump cannot silently move the floor the published platform tags advertise.
# CPython 3.13 itself needs 10.13 on Intel and 3.14 needs 10.15; arm64 begins at macOS 11.
[[tool.cibuildwheel.overrides]]
select = "cp313*-macosx_x86_64"
environment = { MACOSX_DEPLOYMENT_TARGET = "10.13" }

[[tool.cibuildwheel.overrides]]
select = "cp314*-macosx_x86_64"
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }

[[tool.cibuildwheel.overrides]]
select = "*-macosx_arm64"
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
